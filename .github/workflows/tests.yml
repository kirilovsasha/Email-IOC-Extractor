name: tests
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install ruff mypy
      - name: Ruff
        run: python -m ruff check reliquary/core/formats.py reliquary/core/filter_state.py reliquary/core/batch.py reliquary/core/office_extract.py
      - name: Mypy (core helpers)
        run: python -m mypy --follow-imports=silent --ignore-missing-imports reliquary/core/models.py reliquary/core/filter_state.py reliquary/core/formats.py reliquary/core/batch.py
      - name: Test
        run: python -m pytest -q
