name: tests
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check reliquary
      - name: Mypy (core + helpers)
        run: >
          python -m mypy --follow-imports=silent --ignore-missing-imports
          reliquary/core/models.py
          reliquary/core/filter_state.py
          reliquary/core/formats.py
          reliquary/core/batch.py
          reliquary/core/allowlist.py
          reliquary/core/handoff.py
          reliquary/core/exporters.py
          reliquary/core/prefs.py
          reliquary/core/paths.py
          reliquary/core/offline.py
          reliquary/core/error_log.py
          reliquary/core/verdict.py
          reliquary/core/url_rewrite.py
          reliquary/core/lookalike.py
          reliquary/core/content_signals.py
          reliquary/core/analysis_options.py
          reliquary/core/org_profile.py
          reliquary/gui/export_actions.py
          reliquary/gui/tabs.py
          reliquary/gui/windowing.py
      - name: Test
        run: python -m pytest -q
      - name: Corpus metrics
        run: python scripts/corpus_metrics.py

  build-exe:
    runs-on: windows-latest
    needs: pytest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .
      - name: Sync version + build
        run: |
          python build/sync_version_info.py
          python -m PyInstaller build/reliquary.spec --noconfirm
      - name: Smoke CLI + EXE
        shell: cmd
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m reliquary.cli --help >nul
          if errorlevel 1 exit /b 1
          python -m reliquary.cli samples\corpus\benign_hr_notice.eml --quiet-verdict --iocs-only >nul
          if errorlevel 1 exit /b 1
          if not exist dist\EmailIOCExtractor.exe (
            echo EXE missing
            dir /s /b dist 2>nul
            exit /b 1
          )
          for %%A in (dist\EmailIOCExtractor.exe) do echo EXE OK size=%%~zA
          for %%A in (dist\EmailIOCExtractor.exe) do if %%~zA LSS 1048576 (
            echo EXE too small
            exit /b 1
          )
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmailIOCExtractor
          path: dist/EmailIOCExtractor.exe
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: pytest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .
          python build/sync_version_info.py
          python -m PyInstaller build/reliquary.spec --noconfirm
      - name: Extract changelog snippet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          out = []
          started = False
          for line in lines:
              if line.startswith("## ") and started:
                  break
              if line.startswith("## "):
                  started = True
              if started:
                  out.append(line)
          Path("release_notes.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmailIOCExtractor.exe
          body_path: release_notes.md
          generate_release_notes: true
