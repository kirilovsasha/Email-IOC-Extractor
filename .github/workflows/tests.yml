name: tests
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e ".[dev]"
      - name: Version sync check
        run: |
          python build/sync_version_info.py
          git diff --exit-code -- pyproject.toml build/version_info.txt || (
            echo "Run: python build/sync_version_info.py" && exit 1
          )
      - name: Ruff
        run: python -m ruff check reliquary
      - name: Mypy (core + helpers)
        run: >
          python -m mypy --follow-imports=silent --ignore-missing-imports
          reliquary/core/models.py
          reliquary/core/filter_state.py
          reliquary/core/formats.py
          reliquary/core/batch.py
          reliquary/core/allowlist.py
          reliquary/core/handoff.py
          reliquary/core/exporters.py
          reliquary/core/prefs.py
          reliquary/core/paths.py
          reliquary/core/offline.py
          reliquary/core/error_log.py
          reliquary/core/verdict.py
          reliquary/core/url_rewrite.py
          reliquary/core/lookalike.py
          reliquary/core/content_signals.py
          reliquary/core/analysis_options.py
          reliquary/core/org_profile.py
          reliquary/core/diff.py
          reliquary/core/export_hook.py
          reliquary/core/pipeline.py
          reliquary/core/ioc_extractor.py
          reliquary/core/header_analyzer.py
          reliquary/core/attachment_inspector.py
          reliquary/core/defang.py
          reliquary/core/update_check.py
          reliquary/core/qr_scan.py
          reliquary/core/office_extract.py
          reliquary/gui/export_actions.py
          reliquary/gui/tabs.py
          reliquary/gui/windowing.py
          reliquary/gui/filters_actions.py
          reliquary/gui/i18n.py
          reliquary/gui/about.py
      - name: Test + coverage (core)
        run: >
          python -m pytest -q
          --cov=reliquary/core
          --cov-report=term-missing:skip-covered
          --cov-fail-under=68
      - name: Corpus metrics
        run: python scripts/corpus_metrics.py

  build-exe:
    runs-on: windows-latest
    needs: pytest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .
      - name: Sync version + build
        run: |
          python build/sync_version_info.py
          python -m PyInstaller build/reliquary.spec --noconfirm
      - name: Smoke CLI + frozen --cli
        shell: cmd
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python -m reliquary.cli --help >nul
          if errorlevel 1 exit /b 1
          python -m reliquary.cli samples\corpus\benign_hr_notice.eml --quiet-verdict --iocs-only >nul
          if errorlevel 1 exit /b 1
          if not exist dist\EmailIOCExtractor.exe (
            echo EXE missing
            dir /s /b dist 2>nul
            exit /b 1
          )
          for %%A in (dist\EmailIOCExtractor.exe) do echo EXE OK size=%%~zA
          for %%A in (dist\EmailIOCExtractor.exe) do if %%~zA LSS 1048576 (
            echo EXE too small
            exit /b 1
          )
          dist\EmailIOCExtractor.exe --cli samples\corpus\benign_hr_notice.eml --json dist\smoke_report.json --quiet-verdict
          if errorlevel 1 exit /b 1
          if not exist dist\smoke_report.json (
            echo frozen CLI smoke failed: no JSON
            exit /b 1
          )
      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash dist\EmailIOCExtractor.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EmailIOCExtractor.exe" } |
            Set-Content -Encoding ascii dist\EmailIOCExtractor.exe.sha256
          Get-Content dist\EmailIOCExtractor.exe.sha256
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmailIOCExtractor
          path: |
            dist/EmailIOCExtractor.exe
            dist/EmailIOCExtractor.exe.sha256
          if-no-files-found: error

  build-exe-full:
    runs-on: windows-latest
    needs: pytest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full extras + build
        env:
          RELIQUARY_FULL: "1"
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e ".[rar,qr]"
          python build/sync_version_info.py
          python -m PyInstaller build/reliquary.spec --noconfirm
      - name: SHA256 Full
        shell: pwsh
        run: |
          Copy-Item dist\EmailIOCExtractor.exe dist\EmailIOCExtractor-Full.exe
          Get-FileHash dist\EmailIOCExtractor-Full.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EmailIOCExtractor-Full.exe" } |
            Set-Content -Encoding ascii dist\EmailIOCExtractor-Full.exe.sha256
      - name: Upload Full EXE
        uses: actions/upload-artifact@v4
        with:
          name: EmailIOCExtractor-Full
          path: |
            dist/EmailIOCExtractor-Full.exe
            dist/EmailIOCExtractor-Full.exe.sha256
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: pytest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build Lite
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install -e .
          python build/sync_version_info.py
          python -m PyInstaller build/reliquary.spec --noconfirm
          Copy-Item dist\EmailIOCExtractor.exe dist\EmailIOCExtractor-Lite.exe
        shell: pwsh
      - name: Frozen CLI smoke
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          dist\EmailIOCExtractor-Lite.exe --cli samples\corpus\benign_hr_notice.eml --json dist\smoke_report.json --quiet-verdict
          if errorlevel 1 exit /b 1
          if not exist dist\smoke_report.json exit /b 1
      - name: SHA256 Lite
        shell: pwsh
        run: |
          Copy-Item dist\EmailIOCExtractor-Lite.exe dist\EmailIOCExtractor.exe -Force
          $hash = (Get-FileHash dist\EmailIOCExtractor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EmailIOCExtractor.exe" | Set-Content -Encoding ascii dist\EmailIOCExtractor.exe.sha256
          Get-Content dist\EmailIOCExtractor.exe.sha256
      - name: Build Full (RAR/QR)
        env:
          RELIQUARY_FULL: "1"
        run: |
          pip install -e ".[rar,qr]"
          python -m PyInstaller build/reliquary.spec --noconfirm
          Copy-Item dist\EmailIOCExtractor.exe dist\EmailIOCExtractor-Full.exe
          # Restore Lite artifact name for release upload
          Copy-Item dist\EmailIOCExtractor-Lite.exe dist\EmailIOCExtractor.exe -Force
        shell: pwsh
      - name: SHA256 Full
        shell: pwsh
        run: |
          Get-FileHash dist\EmailIOCExtractor-Full.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  EmailIOCExtractor-Full.exe" } |
            Set-Content -Encoding ascii dist\EmailIOCExtractor-Full.exe.sha256
          Get-Content dist\EmailIOCExtractor-Full.exe.sha256
      - name: Extract changelog snippet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          out = []
          started = False
          for line in lines:
              if line.startswith("## ") and started:
                  break
              if line.startswith("## "):
                  started = True
              if started:
                  out.append(line)
          sha = Path("dist/EmailIOCExtractor.exe.sha256").read_text(encoding="utf-8").strip()
          digest = sha.split()[0] if sha else "(missing)"
          full_sha = Path("dist/EmailIOCExtractor-Full.exe.sha256").read_text(encoding="utf-8").strip()
          full_digest = full_sha.split()[0] if full_sha else "(missing)"
          body = "\n".join(out) + "\n\n## Artifacts\n\n"
          body += "- `EmailIOCExtractor.exe` — **Lite** (без RAR/QR extras)\n"
          body += f"- SHA256 Lite: `{digest}`\n"
          body += "- `EmailIOCExtractor-Full.exe` — **Full** (RAR + QR)\n"
          body += f"- SHA256 Full: `{full_digest}`\n"
          body += "- Без подписи по умолчанию — см. `docs/SIGNING.md` (проверяйте SHA256 перед выкладкой)\n"
          Path("release_notes.md").write_text(body, encoding="utf-8")
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EmailIOCExtractor.exe
            dist/EmailIOCExtractor.exe.sha256
            dist/EmailIOCExtractor-Full.exe
            dist/EmailIOCExtractor-Full.exe.sha256
          body_path: release_notes.md
          generate_release_notes: true
