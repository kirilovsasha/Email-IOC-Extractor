[project]
name = "reliquary"
version = "2.19.1"
description = "Email IOC Extractor — offline email triage with phishing verdict for SOC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2,<7",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "extract-msg>=0.48.5",
  "chardet>=5.2.0",
  "filetype>=1.2.0",
  "olefile>=0.47",
  "py7zr>=0.22.0",
  "pillow>=10.0.0",
  "pyzbar>=0.1.9",
  "windnd>=1.0.7; platform_system=='Windows'",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3.0"]
pst = ["libratom>=0.7.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyinstaller>=6.0", "ruff>=0.8", "mypy>=1.8"]

[project.scripts]
reliquary = "reliquary.cli:main"
email-ioc-extractor = "reliquary.cli:main"
reliquary-gui = "reliquary.gui.app:run"
email-ioc-extractor-gui = "reliquary.gui.app:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reliquary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
