[project]
name = "reliquary"
version = "1.7.1"
description = "IOC Extractor — offline SOC IOC extractor for email, tickets, PDF/HTML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2,<7",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "pypdf>=4.3.1",
  "stix2>=3.0.1",
  "extract-msg>=0.48.5",
  "chardet>=5.2.0",
  "filetype>=1.2.0",
  "olefile>=0.47",
  "py7zr>=0.22.0",
  "pillow>=10.0.0",
  "windnd>=1.0.7; platform_system=='Windows'",
]

[project.optional-dependencies]
rar = ["rarfile>=4.1"]
qr = ["pyzbar>=0.1.9"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reliquary*"]

[project.scripts]
reliquary = "reliquary.cli:main"
reliquary-gui = "reliquary.gui.app:run"
ioc-extractor = "reliquary.cli:main"
ioc-extractor-gui = "reliquary.gui.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
