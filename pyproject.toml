[project]
name = "reliquary"
version = "1.1.0"
description = "Offline SOC utility: IOC extraction (primary) + optional mail phishing triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.1",
  "pypdf>=4.3.1",
  "stix2>=3.0.1",
  "extract-msg>=0.48.5",
  "chardet>=5.2.0",
  "filetype>=1.2.0",
  "olefile>=0.47",
]

[project.scripts]
reliquary = "reliquary.cli:main"
reliquary-gui = "reliquary.gui.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
